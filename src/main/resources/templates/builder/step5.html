<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{builder/layout :: layout(~{::title}, ~{::section}, 5)}">
 
<head>
    <title>Optional Services</title>
</head>
 
<body>
    <section class="stage">
        <div class="step-guide modern">
 
            <div class="guide-header">
                <span class="material-icons">add_circle</span>
                <b>Optional Services (CA ATP)</b>
            </div>
 
            <div class="guide-steps">
 
                <div class="guide-step">
                    <span class="guide-num">1</span>
                    <span> Optional Services are Corporate Account (CA) add-ons — pick a service type, choose a plan, then configure its lines, validity window and service~unit mappings.</span>
                </div>
 
            </div>
 
            <div class="guide-points">
               
                <span class="guide-pill">Corporate Accounts</span>
                 <span class="guide-pill">Optional add-on</span>
                <span class="guide-pill">Line &amp; unit mapping</span>
            </div>
 
        </div>
 
        <div class="svc-panel">
            <div class="svc-group-buttons" id="svcButtons5">
                <button class="svc-pill" data-svc="VOICE" onclick="toggleSvc('VOICE', this)">
                    <span class="material-icons pill-icon">phone</span>
                    VOICE</button>
                <button class="svc-pill" data-svc="SMS" onclick="toggleSvc('SMS', this)">
                    <span class="material-icons pill-icon">sms</span>
                    SMS</button>
                <button class="svc-pill" data-svc="DATA" onclick="toggleSvc('DATA', this)">
                    <span class="material-icons pill-icon">wifi</span>
                    DATA</button>
            </div>
        </div>
 
        <!-- Drop zone — rendered by step5.js -->
        <div id="dropArea" class="service-results"></div>
 
        <div class="step-actions">
            <button class="btn-secondary" onclick="goBack()" th:disabled="${activeStep == 1}">
                <span class="material-icons">arrow_back</span>
                Back
            </button>
 
            <button class="btn-primary" onclick="goNext()" th:disabled="${activeStep == 6}">
                Continue
                <span class="material-icons">arrow_forward</span>
            </button>
        </div>
 
        <script th:src="@{/js/step5.js}"></script>
    </section>
</body>
 
</html>
